name: PR - Main

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # docker compose lee ${VAR} del shell — seteamos las mínimas necesarias
      # para que postgres-app, engram y langfuse-web arranquen sin un .env real.
      - name: Start full stack
        env:
          POSTGRES_USER: asistente
          POSTGRES_PASSWORD: asistente
          POSTGRES_DB: asistente_db
          ENGRAM_PROJECT: arch-agent-test
          LANGFUSE_DB_USER: langfuse
          LANGFUSE_DB_PASSWORD: langfuse
          LANGFUSE_DB_NAME: langfuse
          LANGFUSE_SALT: test-salt-ci-only-not-secure
          NEXTAUTH_SECRET: test-nextauth-secret-ci
          LANGFUSE_INIT_ORG_NAME: arch-agent
          LANGFUSE_INIT_PROJECT_NAME: arch-agent
          LANGFUSE_INIT_USER_EMAIL: ci@arch-agent.local
          LANGFUSE_INIT_USER_PASSWORD: ci-password
          LANGFUSE_INIT_USER_NAME: CI
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DB: default
          S3_BUCKET: langfuse
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio-secret
          S3_REGION: us-east-1
          REDIS_PASSWORD: redis-secret
          LANGFUSE_PUBLIC_KEY: pk-lf-test
          LANGFUSE_SECRET_KEY: sk-lf-test
        run: docker compose up -d postgres-app engram langfuse-web

      - name: Wait for stack healthy
        run: |
          echo "Waiting up to 5 min for stack..."
          for i in {1..60}; do
            HEALTHY=$(docker compose ps --format '{{.Service}} {{.Health}}' 2>/dev/null | grep -cE 'healthy')
            echo "[$i/60] healthy services: $HEALTHY"
            if [ "$HEALTHY" -ge 3 ]; then
              echo "Stack is up"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: stack did not become healthy in time"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Run tests
        env:
          DATABASE_URL: postgresql://asistente:asistente@localhost:5432/asistente_db
          JWT_SECRET_KEY: test-secret-key-for-testing-only-32chars
          LANGFUSE_BASE_URL: http://localhost:3000
          LANGFUSE_PUBLIC_KEY: pk-lf-test
          LANGFUSE_SECRET_KEY: sk-lf-test
          ENGRAM_URL: http://localhost:7439
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import sanity check
        env:
          JWT_SECRET_KEY: test-secret-key-for-testing-only-32chars
        run: python -c "from server import app; print('OK')"
