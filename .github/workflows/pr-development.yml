name: PR - Development

on:
  pull_request:
    branches: [development]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Los tests Postgres-backed (concurrency de HU10, FK de approvals)
      # necesitan el schema aplicado; los demas tests crean sus tablas via
      # Base.metadata. El runner aplica por nombre de archivo con
      # IF NOT EXISTS en cada paso, asi que es idempotente.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: PYTHONPATH=. python migrations/run_migrations.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: PYTHONPATH=. pytest tests/ -v --tb=short
