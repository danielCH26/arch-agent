<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Arial, sans-serif" font-size="16">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">MVC frente a MVVM</text>

  <text x="160" y="66" text-anchor="middle" fill="#334155" font-weight="600">MVC</text>
  <line x1="320" y1="52" x2="320" y2="350" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="#e0f2fe" stroke="#0284c7" stroke-width="2">
    <rect x="90" y="84" width="140" height="48" rx="10"/><rect x="20" y="276" width="120" height="48" rx="10"/><rect x="180" y="276" width="120" height="48" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#0c4a6e" font-weight="600">
    <text x="160" y="114">Controlador</text><text x="80" y="306">Vista</text><text x="240" y="306">Modelo</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="60" y1="276" x2="110" y2="136"/><line x1="200" y1="136" x2="236" y2="272"/><line x1="180" y1="300" x2="144" y2="300"/>
  </g>
  <g font-size="13" fill="#475569">
    <text x="16" y="200">el usuario</text><text x="16" y="216">actúa</text>
    <text x="230" y="200">actualiza</text>
    <text x="160" y="344" text-anchor="middle">el modelo alimenta la vista</text>
  </g>

  <text x="480" y="66" text-anchor="middle" fill="#334155" font-weight="600">MVVM</text>
  <g fill="#ecfdf5" stroke="#059669" stroke-width="2">
    <rect x="410" y="84" width="140" height="48" rx="10"/><rect x="410" y="180" width="140" height="48" rx="10"/><rect x="410" y="276" width="140" height="48" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#065f46" font-weight="600">
    <text x="480" y="114">Vista</text><text x="480" y="210">ViewModel</text><text x="480" y="306">Modelo</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="470" y1="136" x2="470" y2="176" marker-end="url(#a)"/><line x1="490" y1="176" x2="490" y2="136" marker-end="url(#a)"/>
    <line x1="480" y1="228" x2="480" y2="272" marker-end="url(#a)"/>
  </g>
  <g font-size="13" fill="#475569">
    <text x="500" y="152">data binding</text><text x="500" y="168">(dos sentidos)</text>
    <text x="490" y="254">lee y actualiza</text>
    <text x="480" y="344" text-anchor="middle">la vista no conoce el modelo</text>
  </g>

  <text x="320" y="384" text-anchor="middle" font-size="13" fill="#475569">En MVC el controlador recibe las acciones; en MVVM la vista se enlaza al ViewModel,</text>
  <text x="320" y="402" text-anchor="middle" font-size="13" fill="#475569">que expone estado y comandos y se prueba sin interfaz</text>
</svg>
