<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" font-size="16">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">Microkernel (arquitectura de plug-ins)</text>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="320" y1="210" x2="140" y2="105"/><line x1="320" y1="210" x2="500" y2="105"/>
    <line x1="320" y1="210" x2="140" y2="320"/><line x1="320" y1="210" x2="500" y2="320"/>
  </g>
  <rect x="210" y="160" width="220" height="100" rx="12" fill="#1d4ed8"/>
  <text x="320" y="202" text-anchor="middle" fill="#ffffff" font-weight="600">Núcleo (core)</text>
  <text x="320" y="226" text-anchor="middle" fill="#dbeafe" font-size="14">funcionalidad mínima +</text>
  <text x="320" y="244" text-anchor="middle" fill="#dbeafe" font-size="14">registro de plug-ins</text>
  <g fill="#e0f2fe" stroke="#0284c7" stroke-width="2">
    <rect x="50" y="75" width="180" height="60" rx="10"/><rect x="410" y="75" width="180" height="60" rx="10"/>
    <rect x="50" y="290" width="180" height="60" rx="10"/><rect x="410" y="290" width="180" height="60" rx="10" stroke-dasharray="6 4"/>
  </g>
  <g text-anchor="middle" fill="#0c4a6e">
    <text x="140" y="111">Plug-in A</text><text x="500" y="111">Plug-in B</text>
    <text x="140" y="326">Plug-in C</text><text x="500" y="326">Nuevo plug-in</text>
  </g>
  <text x="320" y="385" text-anchor="middle" font-size="13" fill="#475569">Los plug-ins se conectan al núcleo por un contrato común y se agregan o quitan sin modificarlo</text>
</svg>
