<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" font-size="16">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">Data Transfer Object (DTO)</text>
  <rect x="20" y="150" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="85.0" y="181.0" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2937">Cliente</text>
  <text x="85.0" y="200.0" text-anchor="middle" font-size="12" fill="#475569">web / móvil</text>
  <rect x="225" y="70" width="190" height="230" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="320" y="94" text-anchor="middle" font-size="13" fill="#475569">Frontera remota (API)</text>
  <rect x="245" y="110" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320.0" y="136.0" text-anchor="middle" font-weight="600" font-size="15" fill="#1e3a8a">PedidoDTO</text>
  <text x="320.0" y="155.0" text-anchor="middle" font-size="12" fill="#475569">datos del contrato</text>
  <rect x="245" y="215" width="150" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="320.0" y="241.0" text-anchor="middle" font-weight="600" font-size="15" fill="#065f46">Mapeador</text>
  <text x="320.0" y="260.0" text-anchor="middle" font-size="12" fill="#475569">DTO ↔ entidad</text>
  <rect x="490" y="150" width="130" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="555.0" y="181.0" text-anchor="middle" font-weight="600" font-size="15" fill="#4c1d95">Entidad Pedido</text>
  <text x="555.0" y="200.0" text-anchor="middle" font-size="12" fill="#475569">modelo interno</text>
  <line x1="150" y1="175" x2="240" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="168" y="128" font-size="12" fill="#475569" text-anchor="middle">petición / respuesta</text>
  <line x1="320" y1="170" x2="320" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="395" y1="245" x2="485" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="320" y="378" text-anchor="middle" font-size="13" fill="#475569">La API expone el DTO, no la entidad: el contrato cambia sin tocar el dominio y viceversa</text>
</svg>
