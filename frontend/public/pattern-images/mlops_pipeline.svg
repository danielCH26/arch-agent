    <line x1="150" y1="112" x2="176" y2="112"/><line x1="310" y1="112" x2="336" y2="112"/><line x1="470" y1="112" x2="491" y2="112"/>
    <line x1="557" y1="144" x2="557" y2="216"/><line x1="495" y1="252" x2="464" y2="252"/><line x1="300" y1="252" x2="264" y2="252"/>
