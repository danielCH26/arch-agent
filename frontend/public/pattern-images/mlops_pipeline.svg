  <g fill="#4c1d95" text-anchor="middle">
    <text x="557" y="248">Despliegue</text><text x="557" y="268">(CI/CD)</text>
    <text x="380" y="248">Monitoreo en</text><text x="380" y="268">producción (drift)</text>
  </g>
  <rect x="70" y="220" width="190" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="165" y="248" text-anchor="middle" fill="#78350f">Disparador de</text><text x="165" y="268" text-anchor="middle" fill="#78350f">reentrenamiento</text>
