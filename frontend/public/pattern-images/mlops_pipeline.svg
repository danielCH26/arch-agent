<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">Pipeline de MLOps</text>
  <g fill="#e0f2fe" stroke="#0284c7" stroke-width="2">
    <rect x="20" y="80" width="130" height="64" rx="10"/><rect x="180" y="80" width="130" height="64" rx="10"/><rect x="340" y="80" width="130" height="64" rx="10"/><rect x="495" y="80" width="125" height="64" rx="10"/>
  </g>
  <g fill="#0c4a6e" text-anchor="middle">
