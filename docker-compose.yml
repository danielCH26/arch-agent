# =============================================================================
# Docker Compose — Asistente de Arquitectura (F01)
# 8 servicios: app, postgres-app, engram, langfuse-web, langfuse-db,
#              clickhouse, minio, redis
# =============================================================================
# Levantar todo:  docker compose up -d
# Ver logs:       docker compose logs -f app
# Bajar todo:     docker compose down
# Bajar + volumen: docker compose down -v
# =============================================================================

services:
  # ===========================================================================
  # APP PRINCIPAL (Chainlit + LangChain + MCPs)
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asistente-app
    ports:
      - "8000:8000"
    depends_on:
      postgres-app:
        condition: service_healthy
      engram:
        condition: service_started
      langfuse-web:
        condition: service_started
    env_file:
      - .env
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-app:5432/${POSTGRES_DB}

      # Langfuse
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: http://langfuse-web:3000

      # Engram
      ENGRAM_PROJECT: ${ENGRAM_PROJECT}
      ENGRAM_DATA_DIR: /root/.engram

      # LLM defaults (configurables luego en UI)
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}

      # MCPs stdio paths (dentro del container)
      PUPPETEER_CACHE_DIR: /app/.cache/puppeteer
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "false"
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
      - models_cache:/app/models_cache
      - npm_cache:/app/.npm
      - uv_cache:/app/.cache/uv
      - puppeteer_cache:/app/.cache/puppeteer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # ENGRAM (Memoria persistente)
  # ===========================================================================
  engram:
    image: ghcr.io/gentleman-programming/engram:latest
    container_name: asistente-engram
    stdin_open: true
    tty: true
    volumes:
      - engram_data:/root/.engram
    environment:
      ENGRAM_PROJECT: ${ENGRAM_PROJECT}
    restart: unless-stopped

  # ===========================================================================
  # POSTGRES + PGVECTOR (DB de la app)
  # ===========================================================================
  postgres-app:
    image: pgvector/pgvector:pg16
    container_name: asistente-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_app_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # LANGFUSE — Web UI
  # ===========================================================================
  langfuse-web:
    image: langfuse/langfuse:4
    container_name: asistente-langfuse-web
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/${LANGFUSE_DB_NAME}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION}
      REDIS_URL: redis://redis:6379
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Langfuse — DB
  langfuse-db:
    image: postgres:16
    container_name: asistente-langfuse-db
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_DB_NAME}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER} -d ${LANGFUSE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Langfuse — ClickHouse (analytics)
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: asistente-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Langfuse — MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: asistente-minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Langfuse — Redis (cache)
  redis:
    image: redis:7
    container_name: asistente-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# =============================================================================
# VOLÚMENES PERSISTENTES
# =============================================================================
volumes:
  # App
  app_uploads:
    name: asistente_app_uploads
  app_logs:
    name: asistente_app_logs
  models_cache:
    name: asistente_models_cache
  npm_cache:
    name: asistente_npm_cache
  uv_cache:
    name: asistente_uv_cache
  puppeteer_cache:
    name: asistente_puppeteer_cache

  # Engram
  engram_data:
    name: asistente_engram_data

  # Postgres App
  pg_app_data:
    name: asistente_pg_app_data

  # Langfuse
  langfuse_db_data:
    name: asistente_langfuse_db_data
  langfuse_clickhouse_data:
    name: asistente_langfuse_clickhouse_data
  langfuse_clickhouse_logs:
    name: asistente_langfuse_clickhouse_logs
  langfuse_minio_data:
    name: asistente_langfuse_minio_data
  redis_data:
    name: asistente_redis_data

# =============================================================================
# REDES
# =============================================================================
networks:
  default:
    name: asistente-net
