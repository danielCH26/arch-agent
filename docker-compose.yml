# =============================================================================
# Docker Compose (F01)
# 8 servicios: app, postgres-app, engram, langfuse-web, langfuse-db,
#              clickhouse, minio, redis
# =============================================================================
# Levantar todo:  docker compose up -d
# Ver logs:       docker compose logs -f app
# Bajar todo:     docker compose down
# Bajar + volumen: docker compose down -v
# =============================================================================

services:
  # ===========================================================================
  # APP (Chainlit + LangChain + MCPs)
  # ===========================================================================
  # F01: este container es un PLACEHOLDER. Solo existe para que el compose
  # tenga los 8 servicios del spec. La imagen real (Chainlit + LangChain)
  # llega en F02. Aqui usamos alpine + sleep infinity para que:
  #   - el container arranque y se mantenga Up
  #   - las env vars lleguen al container (F02 las va a usar)
  #   - NO se instale nada de Python/Node (esos viven en F02)
  # ===========================================================================
  app:
    container_name: app
    image: alpine:3.19
    command: ["sleep", "infinity"]
    depends_on:
      postgres-app:
        condition: service_healthy
      engram:
        condition: service_started
      langfuse-web:
        condition: service_started
    env_file:
      - .env
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-app:5432/${POSTGRES_DB}

      # Langfuse
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: http://langfuse-web:3000

      # Engram
      ENGRAM_PROJECT: ${ENGRAM_PROJECT}
      ENGRAM_URL: http://engram:7437

      # LLM defaults (configurables luego en UI)
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    restart: unless-stopped

  # ===========================================================================
  # ENGRAM (Memoria persistente)
  # ===========================================================================
  engram:
    container_name: engram
    image: ghcr.io/gentleman-programming/engram:latest
    # 'engram serve' arranca el HTTP API server (puerto default 7437).
    # NO existe subcomando 'cloud' en la imagen open-source — eso era del
    # stack doc original y causaba el restart loop. Mapeamos 7437 por si
    # se quiere usar desde la app o para `docker compose exec engram engram ...`.
    # Engram solo escucha en 127.0.0.1. El proxy engram-proxy publica 7437
    # y reenvía a este puerto interno en el mismo namespace de red.
    command: serve 7438
    ports:
      - "7437:7437"
    volumes:
      - engram_data:/root/.engram
    environment:
      ENGRAM_PROJECT: ${ENGRAM_PROJECT}
    # El healthcheck lo dejamos simple (TCP) porque el endpoint exacto
    # del HTTP server de engram puede cambiar entre versiones
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:7438/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Hace accesible la API local de Engram para la app del host y otros
  # contenedores. Comparte la red del contenedor engram para alcanzar su
  # listener de loopback (127.0.0.1:7438).
  engram-proxy:
    container_name: engram-proxy
    image: alpine/socat:1.8.1.3
    network_mode: service:engram
    command: TCP-LISTEN:7437,fork,reuseaddr TCP:127.0.0.1:7438
    depends_on:
      engram:
        condition: service_started
    restart: unless-stopped

  # ===========================================================================
  # POSTGRES + PGVECTOR (DB de la app)
  # ===========================================================================
  postgres-app:
    container_name: postgres-app
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_app_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # LANGFUSE — Web UI
  # ===========================================================================
  langfuse-web:
    container_name: langfuse-web
    image: langfuse/langfuse:3
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/${LANGFUSE_DB_NAME}
      # SALT: requerido por Langfuse para encriptar API keys. Generar uno fuerte en prod.
      SALT: ${LANGFUSE_SALT}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      CLICKHOUSE_URL: http://clickhouse:8123
      # Migrations usan protocolo nativo (puerto 9000) con credenciales en URL
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION}
      REDIS_URL: redis://redis:6379
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Langfuse — DB
  langfuse-db:
    container_name: langfuse-db
    image: postgres:16
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_DB_NAME}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER} -d ${LANGFUSE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Langfuse — ClickHouse (analytics)
  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./docker/clickhouse-config.xml:/etc/clickhouse-server/config.d/99-langfuse.xml:ro
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    depends_on:
      clickhouse-keeper:
        condition: service_started
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Langfuse — ClickHouse Keeper (coordinacion distribuida para ReplicatedMergeTree)
  # Necesario para que las migraciones de Langfuse (CREATE TABLE ... ON CLUSTER) funcionen.
  clickhouse-keeper:
    container_name: clickhouse-keeper
    image: clickhouse/clickhouse-keeper:24
    volumes:
      - ./docker/clickhouse-keeper-config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - langfuse_clickhouse_keeper_data:/var/lib/clickhouse-keeper
    # Sin healthcheck: la imagen no trae `nc` y el endpoint HTTP no es
    # convencional. clickhouse lo necesita para funcionar, asi que su
    # propio healthcheck ya cubre la verificacion indirecta.
    restart: unless-stopped

  # Langfuse — MinIO (S3-compatible storage)
  minio:
    container_name: minio
    image: minio/minio:latest
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Langfuse — Redis (cache)
  redis:
    container_name: redis
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# =============================================================================
# VOLÚMENES PERSISTENTES
# =============================================================================
volumes:
  # App
  app_uploads:
  app_logs:
  models_cache:
  npm_cache:
  uv_cache:
  puppeteer_cache:

  # Engram
  engram_data:

  # Postgres App
  pg_app_data:

  # Langfuse
  langfuse_db_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_clickhouse_keeper_data:
  redis_data:

