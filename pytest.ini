[pytest]
# F18 round 3: silence SOLO las deprecation warnings de librerias externas
# (pydantic, langchain, starlette). Antes teniamos "ignore::DeprecationWarning"
# global, que tambien tapaba nuestras propias deprecaciones (PR #102 round 3,
# Soomri: "el filtro es demasiado amplio, esconde senales reales").
#
# Format: action:category:message-or-module. El tercer campo es una regex
# sobre el module path del warning. Usar .* al final para matchear
# submódulos (pydantic.* matchea pydantic.fields, pydantic.validators, etc.).
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:langchain.*
    ignore::DeprecationWarning:starlette.testclient
    ignore::PendingDeprecationWarning
