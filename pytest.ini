[pytest]
# F18 round 3: silence SOLO las deprecation warnings de librerias externas
# (pydantic, langchain, starlette). Antes teniamos "ignore::DeprecationWarning"
# global, que tambien tapaba nuestras propias deprecaciones (PR #102 round 3,
# Soomri: "el filtro es demasiado amplio, esconde senales reales").
#
# Format: action:category:module. El tercer campo NO es "el module path del
# warning": es el modulo al que Python ATRIBUYE el aviso, que depende del
# stacklevel con que se emite. Se matchea con re.match, o sea como prefijo:
# "pydantic" ya cubre pydantic.fields, pydantic.validators y demas submodulos,
# por eso el ".*" sobra (y ademas el "." matchearia cualquier caracter).
filterwarnings =
    ignore::DeprecationWarning:pydantic
    ignore::DeprecationWarning:langchain
    ignore::DeprecationWarning:starlette.testclient
    ignore::PendingDeprecationWarning
