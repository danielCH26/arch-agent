[pytest]
# F18 round 3: silence SOLO las deprecation warnings de librerias externas
# (pydantic, langchain, starlette). Antes teniamos "ignore::DeprecationWarning"
# global, que tambien tapaba nuestras propias deprecaciones (PR #102 round 3,
# Soomri: "el filtro es demasiado amplio, esconde senales reales").
#
# Formato de -W de Python: action:message:category:module:lineno.
# En "ignore::DeprecationWarning:pydantic" el campo 2 (message) va vacio,
# asi que category es el 3ro y module es el 4to. No es "el tercer campo".
# El modulo es al que Python ATRIBUYE el aviso, que depende del stacklevel
# con que se emite, y se matchea con re.match (o sea como prefijo): "pydantic"
# ya cubre pydantic.fields y demas submodulos, por eso el ".*" sobra.
filterwarnings =
    ignore::DeprecationWarning:pydantic
    ignore::DeprecationWarning:langchain
    ignore::DeprecationWarning:starlette.testclient
    ignore::PendingDeprecationWarning
