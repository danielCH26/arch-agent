[pytest]
# F18: silence pydantic + langchain deprecation warnings that would
# otherwise leak into the test output and slow collection.
# (Previously this was ``filterwarnings = [...]`` as a Python variable
# in conftest.py, which pytest ignores — only ini-style filterwarnings
# are honored.)
#
# Format: action:category:message-or-module. Use a module path to scope
# by origin. Use "ignore::DeprecationWarning" alone to ignore all
# DeprecationWarnings.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
