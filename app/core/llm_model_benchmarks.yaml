# =============================================================================
# LLM Model Benchmarks — source of truth para tier classification
# =============================================================================
# Cada modelo tiene su MMLU score (0-100) usado por app/core/model_classifier.py
# para clasificarlo en tier1 (>=85), tier2 (60-85), blocked (<60) o unknown.
#
# Para agregar/actualizar scores: PR con la fuente (paper URL, model card
# oficial, leaderboard snapshot). No hay UI de admin — esto es código.
#
# IMPORTANTE: el frontend frontend/src/components/llm-wizard/Step3ModelSelect.tsx
# tiene una copia sincronizada de este diccionario. Si agregas un modelo aca,
# agregalo tambien en el TSX, o vas a quedar con tier drift entre lo que ve
# el usuario y lo que aprueba el backend. Existe un test
# tests/api/test_llm_wizard_yaml_tsx_parity.py que falla automaticamente
# si se desincronizan.
#
# Metodologia de score MMLU:
# - tier1 (>=85): fuente paper oficial o model card del vendor.
# - tier2 (60-85): fuente leaderboard o paper con varianza reportada.
# - unknown: el modelo no aparece aca; el frontend lo muestra como
#   "Sin score conocido" y guarda requiere allow_unknown_model=true.
# - blocked (<60): se listan aca SOLO modelos que NO queremos disponibles
#   por MMLU bajo, para que el classifier los oculte consistentemente
#   del dropdown.
#
# Fuente principal de MMLU scores: papers originales de cada vendor
# (DeepSeek Tech Report, Qwen Blog, Z.ai docs, Anthropic/OpenAI/Google
# Model Cards, Meta Llama Papers) y leaderboards publicos.
# =============================================================================

