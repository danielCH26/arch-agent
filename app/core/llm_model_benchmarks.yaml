# =============================================================================
# LLM Model Benchmarks — source of truth para tier classification
# =============================================================================
# Cada modelo tiene su MMLU score (0-100) usado por app/core/model_classifier.py
# para clasificarlo en tier1 (>=85), tier2 (60-85), blocked (<60) o unknown.
#
# Para agregar/actualizar scores: PR con la fuente (paper URL, leaderboard
# snapshot, vendor announcement). No hay UI de admin — esto es código.
#
# Fuentes principales:
#   - HuggingFace OpenLLM Leaderboard: https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard
#   - Artificial Analysis: https://artificialanalysis.ai/
#   - Papers originales de cada vendor
# =============================================================================

models:

  # ---------------------------------------------------------------------------
  # OpenAI — Tier 1 estricto
  # ---------------------------------------------------------------------------
  - model_id: gpt-4o
    mmlu_score: 88.7
    source: "OpenAI GPT-4o system card (Aug 2024)"
