pattern_name: "Arquitectura hexagonal (Puertos y Adaptadores)"
category: "Monolítica"
complexity: "media"
description: >
  Aísla la lógica de negocio del núcleo mediante puertos (interfaces) y
  adaptadores, de forma que la tecnología externa (DB, UI, APIs) se pueda
  cambiar sin tocar el dominio.
use_cases: >
  Sistemas donde se anticipan cambios de tecnología externa (DB, proveedor de
  mensajería) o que requieren alta cobertura de tests unitarios del dominio.
when_not_to_use: >
  Proyectos pequeños de vida corta donde el boilerplate adicional no se justifica
  frente al beneficio de aislar el dominio.
tradeoffs:
  ventajas:
    - "Núcleo de dominio sin dependencias externas: la lógica de negocio se prueba de forma unitaria inyectando mocks de los puertos, sin levantar base de datos, UI ni servicios"
    - "Evita el bloqueo tecnológico: cambiar de base de datos, cola o proveedor implica reemplazar un adaptador, sin tocar la lógica de negocio"
    - "Varias entradas sobre la misma lógica: un puerto puede tener múltiples adaptadores (por ejemplo REST y GraphQL) sin afectar al puerto ni al dominio"
    - "Diseño por propósito y no por tecnología: encaja bien con DDD, donde cada componente representa un subdominio y se conecta con los demás de forma débilmente acoplada"
  desventajas:
    - "Código adicional (puertos, adaptadores, fábricas) que solo se justifica si hay varias entradas o salidas, o si la tecnología va a cambiar; si no, es una capa más que mantener"
    - "Mayor complejidad inicial y curva de aprendizaje: separar bien lógica e infraestructura requiere cuidado, y si se hace mal los problemas resultantes son difíciles de resolver"
    - "La capa extra de puertos y adaptadores puede añadir latencia en cada llamada que la cruza"
    - "Se solapa con Clean Architecture y Onion, que persiguen la misma separación: sin acordar cuál se usa y con qué convenciones, el equipo termina mezclando estilos"
decision_signals:
  - pregunta: "¿Anticipas cambiar de proveedor de base de datos, mensajería o API externa?"
    señal_patron: "sí -> Arquitectura hexagonal (Puertos y Adaptadores)"
  - pregunta: "¿Necesitas probar reglas de dominio sin levantar base de datos, UI ni servicios externos?"
    señal_patron: "sí -> Arquitectura hexagonal (Puertos y Adaptadores)"
  - pregunta: "¿El dominio cambia con más frecuencia que la tecnología de entrada o salida?"
    señal_patron: "sí -> Arquitectura hexagonal (Puertos y Adaptadores)"
fuentes:
  - titulo: "Hexagonal architecture pattern (AWS Prescriptive Guidance)"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/hexagonal-architecture.html"
  - titulo: "Hexagonal architecture (Alistair Cockburn)"
    url: "https://alistair.cockburn.us/hexagonal-architecture/"
quality_attributes: [testabilidad, portabilidad, modificabilidad, independencia tecnológica]
team_fit: "equipo de 3 a 10 personas con dominio de negocio complejo que debe probarse sin infraestructura"
example_scenarios:
  - "Sistema de pagos que debe poder cambiar de proveedor (Stripe, PayU, Wompi) sin reescribir la lógica de negocio"
  - "Servicio con reglas de negocio complejas que se expone por REST y por una cola de mensajes y debe tener alta cobertura de pruebas unitarias"
  - "Aplicación que hoy usa PostgreSQL pero el cliente podría exigir migrar a otra base de datos o a una API externa"
