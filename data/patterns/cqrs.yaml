pattern_name: "CQRS (Command Query Responsibility Segregation)"
category: "Patrón de datos"
complexity: "alta"
description: >
  Separa el modelo de escritura (comandos) del modelo de lectura (consultas),
  permitiendo optimizar cada uno de forma independiente.
use_cases: >
  Sistemas con patrones de lectura y escritura muy distintos entre sí, o con
  necesidad de escalar las lecturas por separado.
when_not_to_use: >
  Es mala idea para CRUD sencillo o dominios donde lecturas y escrituras tienen
  el mismo volumen y forma.
tradeoffs:
  ventajas:
    - "Escalado independiente: el modelo de lectura puede crecer horizontalmente (réplicas o un almacén aparte) mientras el de escritura corre en pocas instancias, lo que reduce la contención de bloqueos bajo carga"
    - "Esquemas optimizados por lado: las lecturas usan vistas materializadas o DTO sin joins costosos y las escrituras usan un esquema pensado para transacciones y reglas de negocio"
    - "Separación de responsabilidades: el modelo de escritura concentra validaciones y lógica de dominio, y el de lectura queda simple y sin lógica de negocio, más fácil de mantener y probar por separado"
    - "Seguridad y trabajo en paralelo: solo el lado de comandos puede modificar datos, y dos equipos pueden trabajar escritura y lectura/UI con menos conflictos"
  desventajas:
    - "Consistencia eventual: con almacenes separados la lectura puede mostrar datos viejos tras un comando, y hay que contemplar a usuarios que actúan sobre datos desactualizados"
    - "Más complejidad: hay dos modelos que mantener y sincronizar, un ORM no genera este código automáticamente y la complejidad crece más si se combina con event sourcing"
    - "Mensajería para sincronizar: aparecen fallos, duplicados y reintentos, y como broker y base de datos no comparten una transacción, hacen falta patrones como Transactional Outbox y consumidores idempotentes"
    - "Sobredimensionado para dominios simples: si el dominio o las reglas son sencillas y basta con CRUD, el patrón añade costo sin retorno"
decision_signals:
  - pregunta: "¿Las consultas tienen mucha más carga o requisitos de forma distintos que las escrituras?"
    señal_patron: "sí -> CQRS (Command Query Responsibility Segregation)"
  - pregunta: "¿Necesitas vistas de lectura denormalizadas y optimizadas por pantalla o reporte?"
    señal_patron: "sí -> CQRS (Command Query Responsibility Segregation)"
  - pregunta: "¿El equipo acepta consistencia eventual entre el modelo de escritura y lectura?"
    señal_patron: "sí -> CQRS (Command Query Responsibility Segregation)"
fuentes:
  - titulo: "CQRS pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs"
