recorded:
  proposal: |
    ## Componentes
    - Extractores del ERP y del CRM
    - Orquestador de cargas nocturnas
    - Almacén analítico
    - Tableros

    ## Tecnologias
    | Tecnología | Justificación | Requisito que lo motiva |
    | --- | --- | --- |
    | Python | Extracción y transformación | Cargar datos cada noche |
    | Airflow | Orquestación de cargas | Cargas nocturnas |
    | PostgreSQL | Almacén analítico | Tableros |
    | Metabase | Tableros sin desarrollo | Tableros de indicadores |

    ## Patrones
    - Patrón principal: Pipeline de datos ETL / ELT por lotes

    ## Justificación del patrón principal
    - Motivo de elección: cargas nocturnas por lotes.
    - Reflejo en la arquitectura: extractores, orquestador y almacén.
    - Beneficio esperado: datos listos cada mañana.
    - Riesgo o costo: no hay datos en tiempo real.

    ## Trade-offs y decisión
    | Opción | Ventajas | Desventajas | Complejidad/costo | Ajuste a requisitos | Fuente RAG |
    | --- | --- | --- | --- | --- | --- |
    | ETL por lotes | Simple de operar | Sin tiempo real | Media | Alto | [1] |
    | Capas | Conocido | No resuelve cargas | Baja | Bajo | [2] |
    | Microservicios | Escala por servicio | Operación | Alta | Bajo | [3] |
    - Recomendación: Pipeline ETL por lotes
    - Punto de decisión: ¿Aprueba los trade-offs?
  guide: |
    ### 7.1 Componentes y responsabilidades
    | Componente | Responsabilidad | Se comunica con |
    |---|---|---|
    | Extractores | Leer el ERP y el CRM | Orquestador |
    | Orquestador | Cargas nocturnas | Almacén analítico |
    | Almacén analítico | Datos limpios | Tableros |
    | Tableros | Indicadores | Almacén analítico |

    ### 7.2 Stack tecnológico recomendado
    | Capa | Tecnología | Por qué |
    |---|---|---|
    | Transformación | Python | Analistas lo conocen |
    | Orquestación | Airflow | Cargas programadas |
    | Almacén | PostgreSQL | Volumen moderado |
    | Visualización | Metabase | Tableros sin código |

    ### 7.3 Consecuencias
    **Positivas:** simple. **Negativas / costos asumidos:** sin tiempo real.

    ### 7.4 Riesgos y mitigaciones
    | Riesgo | Impacto | Mitigación |
    |---|---|---|
    | Falla una carga | medio | Reintento y alerta al equipo |

    ### 7.5 Plan de implementación
    1. ERP. 2. CRM. 3. Tableros.

    ### 7.6 Primer sprint
    - Extractor del ERP

    ### 7.7 Estructura inicial del repositorio
    ```
    dags/
    ```

    ### 7.8 Preguntas abiertas
    - ¿Quién valida los indicadores?
