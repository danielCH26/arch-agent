recorded:
  proposal: |
    ## Componentes
    - Servicio de reservas
    - Servicio de pagos
    - Servicio de notificaciones

    ## Tecnologias
    | Tecnología | Justificación | Requisito que lo motiva |
    | --- | --- | --- |
    | Node.js | Lenguaje del equipo | Equipo de 2 desarrolladores |
    | Express | Servicios ligeros | Reservar clases |
    | MongoDB | Documentos flexibles | Reservas |

    ## Patrones
    - Patrón principal: Microservicios

    ## Justificación del patrón principal
    - Motivo de elección: reservas, pagos y notificaciones separados.
    - Reflejo en la arquitectura: un servicio por área.
    - Beneficio esperado: escalar reservas por separado.
    - Riesgo o costo: más despliegues para un equipo de 2.

    ## Trade-offs y decisión
    | Opción | Ventajas | Desventajas | Complejidad/costo | Ajuste a requisitos | Fuente RAG |
    | --- | --- | --- | --- | --- | --- |
    | Microservicios | Escala por servicio | Operación | Alta | Medio | [1] |
    | Monolito modular | Un despliegue | Escala conjunta | Baja | Alto | [2] |
    | Serverless | Pago por uso | Arranques en frío | Media | Alto | [3] |
    - Recomendación: Microservicios
    - Punto de decisión: ¿Aprueba los trade-offs?
  guide: |
    ### 7.1 Componentes y responsabilidades
    | Componente | Responsabilidad | Se comunica con |
    |---|---|---|
    | Servicio de reservas | Cupos | Servicio de notificaciones |
    | Servicio de pagos | Mensualidad | Servicio de reservas |
    | Servicio de notificaciones | Recordatorios | Servicio de reservas |

    ### 7.2 Stack tecnológico recomendado
    | Capa | Tecnología | Por qué |
    |---|---|---|
    | Servicios | Node.js / Express | Equipo |
    | Datos | MongoDB | Documentos |

    ### 7.3 Consecuencias
    **Positivas:** escala por servicio. **Negativas / costos asumidos:** tres despliegues.

    ### 7.4 Riesgos y mitigaciones
    | Riesgo | Impacto | Mitigación |
    |---|---|---|
    | Sobreventa de cupos | alto | Bloqueo al reservar |

    ### 7.5 Plan de implementación
    1. Reservas. 2. Pagos.

    ### 7.6 Primer sprint
    - Modelo de clases

    ### 7.7 Estructura inicial del repositorio
    ```
    reservas/
    ```

    ### 7.8 Preguntas abiertas
    - ¿Qué pasarela de pagos?
