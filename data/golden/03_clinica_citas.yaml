recorded:
  proposal: |
    ## Componentes
    - Módulo de agenda
    - Módulo de pacientes
    - Módulo de notificaciones

    ## Tecnologias
    | Tecnología | Justificación | Requisito que lo motiva |
    | --- | --- | --- |
    | Python | Lenguaje del equipo | Equipo de 4 desarrolladores |
    | FastAPI | API rápida de construir | Plazo de 6 meses |
    | PostgreSQL | Datos relacionales | Agenda de citas |
    | React | Interfaz para pacientes | Agendar y cancelar citas |

    ## Patrones
    - Patrón principal: Monolito modular (Modular Monolith)

    ## Justificación del patrón principal
    - Motivo de elección: tres módulos con límites claros.
    - Reflejo en la arquitectura: agenda, pacientes y notificaciones.
    - Beneficio esperado: un despliegue, módulos aislados.
    - Riesgo o costo: no escala módulos por separado.

    ## Trade-offs y decisión
    | Opción | Ventajas | Desventajas | Complejidad/costo | Ajuste a requisitos | Fuente RAG |
    | --- | --- | --- | --- | --- | --- |
    | Monolito modular | Límites claros | Disciplina | Baja | Alto | [1] |
    | Serverless | Pago por uso | Depuración local | Media | Medio | [2] |
    | Microservicios | Escala por servicio | Operación | Alta | Bajo | [3] |
    - Recomendación: Monolito modular
    - Punto de decisión: ¿Aprueba los trade-offs?
  guide: |
    ### 7.1 Componentes y responsabilidades
    | Componente | Responsabilidad | Se comunica con |
    |---|---|---|
    | Módulo de agenda | Citas | Módulo de pacientes |
    | Módulo de pacientes | Datos de contacto | PostgreSQL |
    | Módulo de notificaciones | Recordatorios por correo | Módulo de agenda |

    ### 7.2 Stack tecnológico recomendado
    | Capa | Tecnología | Por qué |
    |---|---|---|
    | Backend | Python / FastAPI | API |
    | Base de datos | PostgreSQL | Relacional |
    | Frontend | React | Interfaz |

    ### 7.3 Consecuencias
    **Positivas:** un despliegue. **Negativas / costos asumidos:** escala conjunta.

    ### 7.4 Riesgos y mitigaciones
    | Riesgo | Impacto | Mitigación |
    |---|---|---|
    | Fuga de datos | alto | Cifrado en tránsito y roles |

    ### 7.5 Plan de implementación
    1. Agenda. 2. Recordatorios. 3. Sedes.

    ### 7.6 Primer sprint
    - Modelo de citas

    ### 7.7 Estructura inicial del repositorio
    ```
    agenda/
    ```

    ### 7.8 Preguntas abiertas
    - ¿Qué proveedor de correo se usará?
