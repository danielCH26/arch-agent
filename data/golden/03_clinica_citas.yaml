id: clinica-citas
name: Agenda Salud
kind: datos personales
description: Agenda de citas en línea para una clínica de salud con tres sedes.
profile:
  resumen: Agenda de citas médicas con recordatorios.
  dominio: salud
  tipo_sistema: aplicación web
  tipo_proyecto: producto_en_produccion
  equipo_personas: 4
  plazo_meses: 6
  presupuesto_usd: 30000
resumen:
  problema: Las citas se agendan por teléfono y hay muchas inasistencias.
  usuarios: Pacientes, recepcionistas y médicos.
  funcionalidades:
    - Agendar y cancelar citas
    - Recordatorios por correo
  restricciones:
    - Presupuesto de 30000 USD
    - Equipo de 4 desarrolladores
    - Plazo de 6 meses
  calidad:
    - Privacidad de la historia clínica
preguntas_respuestas:
  - pregunta: ¿Qué problema quieres resolver con este sistema?
    respuesta: Las citas se agendan por teléfono y hay muchas inasistencias.
  - pregunta: ¿Quiénes van a usar el sistema?
    respuesta: Pacientes, recepcionistas y médicos.
  - pregunta: ¿Qué es lo más importante que el sistema debe permitir hacer?
    respuesta: Agendar citas y enviar recordatorios por correo un día antes.
  - pregunta: ¿Qué datos personales o sensibles va a guardar el sistema?
    respuesta: Datos de contacto y el motivo de consulta; la historia clínica sigue en el sistema actual.
  - pregunta: ¿Con qué presupuesto cuentan para construir y operar el sistema?
    respuesta: 30000 USD.
  - pregunta: ¿Cuántas personas integran el equipo de desarrollo?
    respuesta: 4 desarrolladores.
  - pregunta: ¿Cuál es el plazo objetivo para el MVP o la primera entrega utilizable?
    respuesta: 6 meses.
candidates:
  - {name: "Monolito modular (Modular Monolith)", similarity: 0.86}
  - {name: "Arquitectura hexagonal (Puertos y Adaptadores)", similarity: 0.85}
  - {name: "Arquitectura en capas (Layered)", similarity: 0.84}
  - {name: "Microservicios", similarity: 0.84}
