# Regresión: guía grabada del ADR de mascotas perdidas. Salió con Gunicorn,
# Docker, GitHub Actions, "SLA 99 %", "2 vCPU / 4 GB" y "<$150/mes", y sin
# hablar de mapas. La rúbrica debe marcar esos problemas y el ADR debe dejar
# la ubicación como pregunta abierta obligatoria.
id: mascotas-perdidas
name: Huellitas
kind: geolocalización
description: App para reportar y encontrar mascotas perdidas en el barrio.
profile:
  resumen: Publicar avisos de mascotas perdidas y encontradas.
  dominio: mascotas
  tipo_sistema: aplicación web
  tipo_proyecto: mvp_prototipo
  equipo_personas: 3
  plazo_meses: 3
  presupuesto_usd: 5000
resumen:
  problema: Los avisos de mascotas perdidas se dispersan en grupos de chat.
  usuarios: Dueños de mascotas y vecinos.
  funcionalidades:
    - Publicar avisos con fotos de la mascota
    - Buscar avisos recientes
  restricciones:
    - Presupuesto de 5000 USD
    - Equipo de 3 personas
    - Plazo de 3 meses
  calidad:
    - Fácil de usar desde el celular
preguntas_respuestas:
  - pregunta: ¿Qué problema quieres resolver con este sistema?
    respuesta: Los avisos de mascotas perdidas se dispersan en grupos de chat.
  - pregunta: ¿Quiénes van a usar el sistema?
    respuesta: Dueños de mascotas y vecinos del barrio.
  - pregunta: ¿Qué es lo más importante que el sistema debe permitir hacer?
    respuesta: Publicar avisos con fotos de la mascota y recibir avisos de quien la vio.
  - pregunta: ¿Con qué presupuesto cuentan para construir y operar el sistema?
    respuesta: 5000 USD.
  - pregunta: ¿Cuántas personas integran el equipo de desarrollo?
    respuesta: 3 personas.
  - pregunta: ¿Cuál es el plazo objetivo para el MVP o la primera entrega utilizable?
    respuesta: 3 meses.
candidates:
  - {name: "Arquitectura en capas (Layered)", similarity: 0.85}
  - {name: "MVC / MVVM (Modelo-Vista-Controlador)", similarity: 0.84}
  - {name: "Monolito modular (Modular Monolith)", similarity: 0.85}
  - {name: "Microservicios", similarity: 0.83}
  - {name: "Serverless (Function-as-a-Service)", similarity: 0.80}
recorded:
  mermaid: |
    flowchart TD
      W[Web móvil] --> AV[Módulo de avisos]
      AV --> US[Módulo de usuarios]
      AV --> DB[(PostgreSQL)]
  proposal: |
    ## Componentes
    - Web móvil
    - Módulo de avisos
    - Módulo de usuarios
    - Almacenamiento local de imágenes

    ## Tecnologias
    | Tecnología | Justificación | Requisito que lo motiva |
    | --- | --- | --- |
    | Python | Lenguaje del equipo | Equipo de 3 personas |
    | Django | Admin y ORM | Plazo de 3 meses |
    | PostgreSQL | Base relacional | Presupuesto de 5000 USD |

    ## Patrones
    - Patrón principal: Monolito modular (Modular Monolith)

    ## Justificación del patrón principal
    - Motivo de elección: módulos claros en un solo despliegue.
    - Reflejo en la arquitectura: módulo de avisos y módulo de usuarios.
    - Beneficio esperado: límites claros sin operación distribuida.
    - Riesgo o costo: disciplina para no acoplar módulos.

    ## Trade-offs y decisión
    | Opción | Ventajas | Desventajas | Complejidad/costo | Ajuste a requisitos | Fuente RAG |
    | --- | --- | --- | --- | --- | --- |
    | Capas | Conocido | Capas de paso | Baja | Alto | [1] |
    | MVC | Separa vista | Solo organiza la UI | Baja | Medio | [2] |
    | Monolito modular | Límites por dominio | Disciplina | Baja | Alto | [3] |
    - Recomendación: Monolito modular
    - Punto de decisión: ¿Aprueba los trade-offs?
  guide: |
    ### 7.1 Componentes y responsabilidades
    | Componente | Responsabilidad | Se comunica con |
    |---|---|---|
    | Web móvil | Pantallas | Módulo de avisos |
    | Módulo de avisos | Publicar y buscar avisos | PostgreSQL |
    | Módulo de usuarios | Registro | PostgreSQL |

    ### 7.2 Stack tecnológico recomendado
    | Capa | Tecnología | Por qué |
    |---|---|---|
    | Lenguaje | Python | Lo conoce el equipo |
    | Framework | Django | Admin incluido |
    | Base de datos | PostgreSQL | Relacional |
    | Servidor | Gunicorn | Producción |
    | Contenedores | Docker | Portabilidad |
    | CI/CD | GitHub Actions | Despliegue automático |
    | Imágenes | Almacenamiento local | Fotos de los avisos |

    ### 7.3 Consecuencias
    **Positivas:** un solo despliegue. **Negativas / costos asumidos:** escala conjunta.

    ### 7.4 Riesgos y mitigaciones
    | Riesgo | Impacto | Mitigación |
    |---|---|---|
    | Caída del servidor | alto | SLA 99 % con el proveedor |

    ### 7.5 Plan de implementación
    Servidor de 2 vCPU / 4 GB por <$150/mes.

    ### 7.6 Primer sprint
    - Crear el proyecto

    ### 7.7 Estructura inicial del repositorio
    ```
    huellitas/
    ```

    ### 7.8 Preguntas abiertas
    - ¿Habrá moderación de avisos?
expect:
  concerns: [ubicacion, archivos, notificaciones]
  checks:
    respeta_restricciones: false   # 7 tecnologías en 7.2
    cifras_con_origen: false       # SLA 99 %, 2 vCPU, 4 GB, $150
    coherencia: false              # Gunicorn, Docker, GitHub Actions no están en la propuesta
    alternativas_diversas: true    # la selección nueva ya no da tres monolitos
    preocupaciones_dominio: true   # la ubicación queda como pregunta obligatoria
