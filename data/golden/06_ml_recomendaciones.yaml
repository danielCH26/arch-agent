recorded:
  proposal: |
    ## Componentes
    - Pipeline de entrenamiento
    - Registro de modelos
    - Servicio de recomendaciones

    ## Tecnologias
    | Tecnología | Justificación | Requisito que lo motiva |
    | --- | --- | --- |
    | Python | Ecosistema de ML | Reentrenar el modelo |
    | scikit-learn | Modelo de recomendación | Recomendar cursos |
    | MLflow | Registro de modelos | Reentrenar cada semana |
    | FastAPI | Servir recomendaciones | Página de inicio |

    ## Patrones
    - Patrón principal: Pipeline de MLOps (entrenamiento, registro y serving de modelos)

    ## Justificación del patrón principal
    - Motivo de elección: el modelo se reentrena cada semana.
    - Reflejo en la arquitectura: pipeline, registro y servicio.
    - Beneficio esperado: versiones de modelo trazables.
    - Riesgo o costo: más piezas que un modelo fijo.

    ## Trade-offs y decisión
    | Opción | Ventajas | Desventajas | Complejidad/costo | Ajuste a requisitos | Fuente RAG |
    | --- | --- | --- | --- | --- | --- |
    | MLOps | Reentrenos trazables | Más piezas | Media | Alto | [1] |
    | Serverless | Pago por uso | Modelos grandes en frío | Media | Medio | [2] |
    | Microservicios | Escala por servicio | Operación | Alta | Bajo | [3] |
    - Recomendación: Pipeline de MLOps
    - Punto de decisión: ¿Aprueba los trade-offs?
  guide: |
    ### 7.1 Componentes y responsabilidades
    | Componente | Responsabilidad | Se comunica con |
    |---|---|---|
    | Pipeline de entrenamiento | Reentrenar cada semana | Registro de modelos |
    | Registro de modelos | Versiones | Servicio de recomendaciones |
    | Servicio de recomendaciones | Responder a la página de inicio | Registro de modelos |

    ### 7.2 Stack tecnológico recomendado
    | Capa | Tecnología | Por qué |
    |---|---|---|
    | Modelo | Python / scikit-learn | Suficiente para el volumen |
    | Registro | MLflow | Versiones |
    | Servicio | FastAPI | API ligera |

    ### 7.3 Consecuencias
    **Positivas:** trazabilidad. **Negativas / costos asumidos:** más piezas.

    ### 7.4 Riesgos y mitigaciones
    | Riesgo | Impacto | Mitigación |
    |---|---|---|
    | Respuesta lenta | medio | Latencia objetivo de 200 ms (supuesto) con caché en memoria |

    ### 7.5 Plan de implementación
    1. Modelo base. 2. Registro. 3. Reentreno.

    ### 7.6 Primer sprint
    - Dataset de interacciones

    ### 7.7 Estructura inicial del repositorio
    ```
    training/
    ```

    ### 7.8 Preguntas abiertas
    - ¿Cómo se mide si una recomendación sirvió?
