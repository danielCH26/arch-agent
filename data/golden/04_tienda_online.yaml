recorded:
  proposal: |
    ## Componentes
    - Módulo de catálogo
    - Módulo de pedidos
    - Integración con Wompi

    ## Tecnologias
    | Tecnología | Justificación | Requisito que lo motiva |
    | --- | --- | --- |
    | Node.js | Lenguaje del equipo | Equipo de 2 desarrolladores |
    | NestJS | Módulos y validación | Plazo de 4 meses |
    | PostgreSQL | Pedidos transaccionales | Carrito y pagos |
    | Wompi | Pasarela de pagos | Pagos en línea |

    ## Patrones
    - Patrón principal: Monolito modular (Modular Monolith)

    ## Justificación del patrón principal
    - Motivo de elección: catálogo y pedidos como módulos.
    - Reflejo en la arquitectura: módulo de catálogo y módulo de pedidos.
    - Beneficio esperado: un despliegue barato.
    - Riesgo o costo: picos de tráfico escalan todo junto.

    ## Trade-offs y decisión
    | Opción | Ventajas | Desventajas | Complejidad/costo | Ajuste a requisitos | Fuente RAG |
    | --- | --- | --- | --- | --- | --- |
    | Monolito modular | Barato | Escala conjunta | Baja | Alto | [1] |
    | Serverless | Pago por uso | Arranques en frío | Media | Medio | [2] |
    | API Gateway + BFF | Una API por cliente | Otra pieza que operar | Media | Bajo | [3] |
    - Recomendación: Monolito modular
    - Punto de decisión: ¿Aprueba los trade-offs?
  guide: |
    ### 7.1 Componentes y responsabilidades
    | Componente | Responsabilidad | Se comunica con |
    |---|---|---|
    | Módulo de catálogo | Productos | PostgreSQL |
    | Módulo de pedidos | Carrito y pago | Integración con Wompi |

    ### 7.2 Stack tecnológico recomendado
    | Capa | Tecnología | Por qué |
    |---|---|---|
    | Backend | Node.js + NestJS | Módulos |
    | Base de datos | PostgreSQL | Transacciones |
    | Pagos | Wompi | Pasarela local |

    ### 7.3 Consecuencias
    **Positivas:** barato. **Negativas / costos asumidos:** escala conjunta.

    ### 7.4 Riesgos y mitigaciones
    | Riesgo | Impacto | Mitigación |
    |---|---|---|
    | Pago duplicado | alto | Webhook idempotente |

    ### 7.5 Plan de implementación
    1. Catálogo. 2. Pedidos. 3. Pagos.

    ### 7.6 Primer sprint
    - Modelo de productos

    ### 7.7 Estructura inicial del repositorio
    ```
    tienda/
    ```

    ### 7.8 Preguntas abiertas
    - ¿Habrá envíos a otras ciudades?
